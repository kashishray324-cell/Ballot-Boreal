name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ballot-boreal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: uv sync --directory backend --all-groups
      - name: Install official Compact devtools and toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.0/compact-installer.sh \
            -o /tmp/compact-installer.sh
          sh /tmp/compact-installer.sh
          "$HOME/.local/bin/compact" update 0.31.1
          "$HOME/.local/bin/compact" compile --version
      - name: Compile Compact contract
        working-directory: contracts
        run: $HOME/.local/bin/compact compile BallotBoreal.compact artifacts
      - name: Verify committed generated artifacts
        run: git diff --exit-code -- contracts/artifacts
      - run: npm run contract:validate
      - run: npm run lint
      - run: npm test
      - run: uv run --directory backend ruff check .
      - run: uv run --directory backend pytest
      - run: npm run build
